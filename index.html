<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudySchools · Kie AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            padding: 1rem;
            margin: 0;
        }

        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1e1e2f;
            --border: #d0d7de;
            --input-bg: #f8fafc;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            --muted: #5e6f8d;
            --accent: #2a6df4;
            --accent-hover: #1a56d6;
            --warning-bg: #fff3cd;
            --warning-text: #856404;
            --warning-border: #ffc107;
            --console-bg: #1e1e2e;
            --console-text: #e0e0e0;
            --header-bg: #ffffff;
            --header-shadow: 0 2px 10px rgba(0, 0, 0, 0.03);
            --panel-bg: #f8f9fc;
            --success: #2b8c4a;
            --danger: #d44c4c;
            --gradient-start: #2a6df4;
            --gradient-end: #7b5cf6;
        }

        body.dark {
            --bg: #16161f;
            --card-bg: #242436;
            --text: #eaeef2;
            --border: #3d3d55;
            --input-bg: #2b2b3f;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            --muted: #a0b3cc;
            --accent: #4f8cff;
            --accent-hover: #6f9eff;
            --warning-bg: #3d3a1f;
            --warning-text: #f5e56b;
            --warning-border: #b8960f;
            --console-bg: #0d0d18;
            --console-text: #cfd7e6;
            --header-bg: #1f1f32;
            --header-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            --panel-bg: #1e1e30;
            --gradient-start: #4f8cff;
            --gradient-end: #9b7cff;
        }

        .app-wrapper {
            width: 100%;
            max-width: 860px;
            background: var(--card-bg);
            border-radius: 2.5rem;
            box-shadow: var(--shadow);
            padding: 1.8rem 2rem 2rem;
            border: 1px solid var(--border);
        }

        .studyschools-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--header-bg);
            padding: 0.6rem 1.2rem 0.6rem 1.5rem;
            border-radius: 4rem;
            margin-bottom: 1.8rem;
            box-shadow: var(--header-shadow);
            border: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
            color: var(--text);
        }
        .brand i {
            color: var(--accent);
            font-size: 1.8rem;
        }
        .brand span {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-toggle-header {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 3rem;
            padding: 0.45rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .theme-toggle-header i {
            font-size: 1rem;
            color: var(--accent);
        }
        .theme-toggle-header:hover {
            background: var(--border);
        }

        /* ----- GATE ----- */
        .gate-section {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 0.2rem;
        }
        .key-input-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        #apiKeyInput {
            flex: 2;
            min-width: 180px;
            padding: 0.8rem 1.2rem;
            border-radius: 3rem;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }
        #apiKeyInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(42, 109, 244, 0.2);
        }

        .btn {
            padding: 0.8rem 1.8rem;
            border-radius: 3rem;
            font-weight: 600;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            transition: all 0.15s;
        }
        .btn:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(42, 109, 244, 0.3);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            background: var(--input-bg);
            transform: scale(1.02);
        }
        .btn-success {
            background: var(--success);
        }
        .btn-success:hover {
            background: #1a7a3a;
        }
        .btn-danger {
            background: var(--danger);
        }
        .btn-danger:hover {
            background: #b33c3c;
        }

        .status-msg {
            font-size: 0.9rem;
            color: var(--muted);
            min-height: 1.6rem;
            padding: 0.3rem 0;
        }
        .status-msg.error {
            color: var(--danger);
            font-weight: 500;
        }
        .status-msg.success {
            color: var(--success);
            font-weight: 500;
        }

        /* ----- AI CONTENT ----- */
        .ai-content {
            display: none;
            margin-top: 1.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1.8rem;
            flex-direction: column;
            gap: 1.5rem;
        }
        .ai-content.active {
            display: flex;
        }

        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .ai-header h2 {
            font-weight: 600;
            font-size: 1.5rem;
            color: var(--text);
        }
        .ai-header h2 i {
            color: var(--accent);
            margin-right: 0.4rem;
        }

        /* ----- ADMIN PANEL ----- */
        .admin-panel {
            background: var(--panel-bg);
            border-radius: 1.8rem;
            padding: 1.2rem 1.5rem;
            border: 2px solid var(--border);
            margin-top: 0.2rem;
            position: relative;
        }
        .admin-panel.locked {
            opacity: 0.85;
        }
        .admin-panel.locked .admin-inner {
            pointer-events: none;
            opacity: 0.4;
            filter: blur(1px);
        }
        .admin-panel.locked::after {
            content: "🔒 Admin panel locked · access code required";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);
            border-radius: 1.8rem;
            font-weight: 600;
            color: var(--text);
            font-size: 1rem;
            letter-spacing: 0.3px;
            z-index: 2;
        }

        .admin-unlock-row {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 3;
        }
        #adminCodeInput {
            padding: 0.5rem 1.2rem;
            border-radius: 3rem;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            flex: 1;
            min-width: 140px;
        }

        .admin-inner {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .admin-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
        }
        .admin-row label {
            font-weight: 500;
            min-width: 100px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .admin-row input,
        .admin-row select {
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            flex: 1;
            min-width: 100px;
        }
        .admin-row .btn {
            padding: 0.4rem 1.2rem;
            font-size: 0.8rem;
        }
        .key-list {
            background: var(--input-bg);
            border-radius: 1.2rem;
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            max-height: 180px;
            overflow-y: auto;
        }
        .key-list .key-item {
            display: inline-block;
            background: var(--card-bg);
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            margin: 0.2rem 0.3rem;
            border: 1px solid var(--border);
            font-size: 0.8rem;
        }
        .key-list .key-item.basic {
            border-left: 3px solid var(--accent);
        }
        .key-list .key-item.plan {
            border-left: 3px solid #f7b731;
        }
        .key-list .key-item.expired {
            opacity: 0.5;
            text-decoration: line-through;
        }

        /* console */
        .console-panel {
            display: none;
            background: var(--console-bg);
            color: var(--console-text);
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            flex-direction: column;
            gap: 0.8rem;
            border-left: 4px solid var(--accent);
            font-family: 'Menlo', 'Cascadia Code', monospace;
            font-size: 0.9rem;
        }
        .console-panel.open {
            display: flex;
        }
        .console-warning {
            background: var(--warning-bg);
            color: var(--warning-text);
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid var(--warning-border);
            font-family: system-ui;
        }
        .console-textarea {
            background: #0b0b16;
            border: 1px solid #3a3a52;
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            color: #d6dee8;
            font-family: inherit;
            font-size: 0.85rem;
            resize: vertical;
            min-height: 70px;
            width: 100%;
            outline: none;
        }
        .console-textarea:focus {
            border-color: var(--accent);
        }
        .console-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .console-actions .btn {
            padding: 0.4rem 1.2rem;
            font-size: 0.8rem;
            border-radius: 2rem;
        }
        .console-output {
            background: #0b0b16;
            border-radius: 1rem;
            padding: 0.6rem 1rem;
            border: 1px solid #2d2d44;
            min-height: 2.5rem;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
            color: #bcc6d4;
        }

        .ai-query-area {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        #userPrompt {
            padding: 0.9rem 1.2rem;
            border-radius: 2rem;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            resize: vertical;
            min-height: 60px;
        }
        #userPrompt:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(42, 109, 244, 0.1);
        }
        .ai-response-box {
            background: var(--input-bg);
            border-radius: 1.8rem;
            padding: 1.2rem 1.6rem;
            border: 1px solid var(--border);
            min-height: 4rem;
            color: var(--text);
            font-size: 0.95rem;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .footer-meta {
            margin-top: 0.8rem;
            font-size: 0.75rem;
            color: var(--muted);
            text-align: right;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--accent);
            color: white;
        }
        .badge.plan {
            background: #f7b731;
            color: #1e1e2f;
        }

        @media (max-width: 500px) {
            .app-wrapper {
                padding: 1.2rem;
            }
            .studyschools-header {
                flex-wrap: wrap;
                gap: 0.6rem;
            }
            .key-input-row {
                flex-direction: column;
            }
            .admin-row {
                flex-direction: column;
                align-items: stretch;
            }
            .admin-row label {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- HEADER -->
        <div class="studyschools-header">
            <div class="brand"><i class="fas fa-graduation-cap"></i><span>StudySchools</span></div>
            <button class="theme-toggle-header" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i><span id="themeLabel">Dark</span></button>
        </div>

        <!-- GATE -->
        <div class="gate-section" id="gateSection">
            <div class="key-input-row">
                <input type="text" id="apiKeyInput" placeholder="🔑 Enter access key" />
                <button class="btn" id="unlockBtn"><i class="fas fa-key"></i> Unlock</button>
            </div>
            <div class="status-msg" id="statusMsg"><i class="fas fa-info-circle"></i> Join <a href="#" onclick="event.preventDefault()" style="color:var(--accent);text-decoration:none;font-weight:500;">https://discord.gg/W6UtgMawFJ</a> for the key</div>
        </div>

        <!-- MAIN AI CONTENT -->
        <div class="ai-content" id="aiContent">
            <!-- ADMIN PANEL -->
            <div class="admin-panel locked" id="adminPanel">
                <div class="admin-unlock-row">
                    <input type="password" id="adminCodeInput" placeholder="Admin access code" />
                    <button class="btn btn-outline" id="adminUnlockBtn"><i class="fas fa-lock"></i> Unlock</button>
                </div>
                <div class="admin-inner">
                    <div class="admin-row">
                        <label><i class="fas fa-key" style="color:var(--accent);"></i> Basic Keys</label>
                        <input type="text" id="basicKeyInput" placeholder="new key" />
                        <select id="basicDuration">
                            <option value="1h">1 hour</option>
                            <option value="6h">6 hours</option>
                            <option value="24h">24 hours</option>
                            <option value="7d">7 days</option>
                        </select>
                        <button class="btn btn-success" id="addBasicKeyBtn"><i class="fas fa-plus"></i> Add</button>
                    </div>
                    <div class="admin-row">
                        <label><i class="fas fa-crown" style="color:#f7b731;"></i> Plan Keys</label>
                        <input type="text" id="planKeyInput" placeholder="plan key" />
                        <button class="btn" id="addPlanKeyBtn" style="background:#f7b731;color:#1e1e2f;"><i class="fas fa-plus"></i> Add</button>
                    </div>
                    <div class="key-list" id="keyListDisplay">🔑 Active keys: (none)</div>
                    <div style="font-size:0.8rem;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap;">
                        <span><i class="fas fa-info-circle"></i> Basic: 75 msgs</span>
                        <span><i class="fas fa-infinity"></i> Plan: unlimited</span>
                        <span><i class="fas fa-globe"></i> Saved globally</span>
                    </div>
                </div>
            </div>

            <!-- CONSOLE -->
            <div style="display:flex;justify-content:flex-end;"><button class="btn btn-outline" id="consoleToggleBtn"><i class="fas fa-terminal"></i> Console</button></div>
            <div class="console-panel" id="consolePanel">
                <div class="console-warning"><i class="fas fa-triangle-exclamation"></i> ⚠️ Only mess with this if you know what you're doing. Local & ephemeral.</div>
                <textarea class="console-textarea" id="consoleInput" placeholder="JS code ..."></textarea>
                <div class="console-actions">
                    <button class="btn" id="consoleRunBtn"><i class="fas fa-play"></i> Run</button>
                    <button class="btn btn-outline" id="consoleClearBtn"><i class="fas fa-eraser"></i> Clear</button>
                </div>
                <div class="console-output" id="consoleOutput">// output</div>
            </div>

            <!-- AI QUERY -->
            <div class="ai-query-area">
                <textarea id="userPrompt" placeholder="Ask Kie AI ..."></textarea>
                <button class="btn" id="askBtn"><i class="fas fa-paper-plane"></i> Ask Kie</button>
                <div class="ai-response-box" id="responseBox">💬 Response</div>
            </div>
            <div class="footer-meta">⚡ local · admin code: Error · keys saved globally</div>
        </div>
    </div>

    <script>
        (function() {
            // ----- THEME -----
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');
            let darkMode = localStorage.getItem('kieTheme') === 'dark';

            function applyTheme(isDark) {
                document.body.classList.toggle('dark', isDark);
                themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
                themeLabel.textContent = isDark ? 'Light' : 'Dark';
                darkMode = isDark;
                localStorage.setItem('kieTheme', isDark ? 'dark' : 'light');
            }
            applyTheme(darkMode);
            themeToggle.addEventListener('click', () => applyTheme(!darkMode));

            // ----- WEBHOOK URLS -----
            const WEBHOOK_BASIC = 'https://discord.com/api/webhooks/1539027975532707882/VHIuitn_63cC9Oo6HOqS12MCvX8wqBUFJ5xzKTKPy9VNFKuNfZACTvd5zmU_Nb4pLpMH';
            const WEBHOOK_PLAN = 'https://discord.com/api/webhooks/1539029554235179069/huJ7xL3Ewk1eVHVQPnhl1X_Sr-IydMejtglzeKNkw4qRZQfTWa21jpKq538EZCP8k9uj';

            // ----- GLOBAL KEY STORAGE (localStorage) -----
            let activeKeys = JSON.parse(localStorage.getItem('kieGlobalKeys')) || {};

            function saveKeys() {
                localStorage.setItem('kieGlobalKeys', JSON.stringify(activeKeys));
                renderKeyList();
                sendDiscordEmbeds();
            }

            function renderKeyList() {
                const container = document.getElementById('keyListDisplay');
                const entries = Object.entries(activeKeys);
                if (entries.length === 0) {
                    container.innerHTML = '🔑 Active keys: (none)';
                    return;
                }
                let html = '🔑 Active keys: ';
                entries.forEach(([k, v]) => {
                    const isExpired = v.expiry && Date.now() > v.expiry;
                    const label = v.type === 'plan' ? '⭐' : '🔹';
                    const expiryStr = v.expiry ? new Date(v.expiry).toLocaleString() : '∞';
                    const usedStr = v.type === 'basic' ? `${v.used||0}/75` : '∞';
                    const cls = `key-item ${v.type}${isExpired ? ' expired' : ''}`;
                    html += `<span class="${cls}">${label} ${k} (${usedStr} · ${expiryStr})</span> `;
                });
                container.innerHTML = html;
            }

            function isKeyValid(key) {
                const entry = activeKeys[key];
                if (!entry) return false;
                if (entry.expiry && Date.now() > entry.expiry) {
                    delete activeKeys[key];
                    saveKeys();
                    return false;
                }
                if (entry.type === 'basic' && (entry.used || 0) >= 75) return false;
                return true;
            }

            function useKey(key) {
                const entry = activeKeys[key];
                if (!entry) return false;
                if (entry.type === 'basic') {
                    entry.used = (entry.used || 0) + 1;
                    if (entry.used >= 75) {
                        delete activeKeys[key];
                    }
                    saveKeys();
                }
                return true;
            }

            // ----- SEND DISCORD EMBEDS -----
            function sendDiscordEmbeds() {
                const entries = Object.entries(activeKeys);
                const basicKeys = entries.filter(([k, v]) => v.type === 'basic' && (!v.expiry || Date.now() < v.expiry));
                const planKeys = entries.filter(([k, v]) => v.type === 'plan');

                // Basic keys embed
                if (basicKeys.length > 0) {
                    const fields = basicKeys.map(([k, v]) => {
                        const remaining = v.expiry ? Math.max(0, Math.floor((v.expiry - Date.now()) / 1000 / 60)) : '∞';
                        return {
                            name: `🔑 ${k}`,
                            value: `Type: Basic\nRemaining: ${75 - (v.used||0)} messages\nTime left: ${remaining === '∞' ? '∞' : remaining + ' min'}`,
                            inline: true
                        };
                    });
                    const embed = {
                        title: '📋 Active Basic Keys',
                        color: 0x2a6df4,
                        fields: fields.slice(0, 25),
                        timestamp: new Date().toISOString(),
                        footer: { text: 'StudySchools Key System' }
                    };
                    fetch(WEBHOOK_BASIC, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ embeds: [embed] })
                    }).catch(err => console.error('Webhook error:', err));
                }

                // Plan keys embed
                if (planKeys.length > 0) {
                    const fields = planKeys.map(([k, v]) => ({
                        name: `⭐ ${k}`,
                        value: `Type: Plan\nUnlimited messages\nActive: ✅`,
                        inline: true
                    }));
                    const embed = {
                        title: '👑 Active Plan Keys',
                        color: 0xf7b731,
                        fields: fields.slice(0, 25),
                        timestamp: new Date().toISOString(),
                        footer: { text: 'StudySchools Plan Keys' }
                    };
                    fetch(WEBHOOK_PLAN, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ embeds: [embed] })
                    }).catch(err => console.error('Webhook error:', err));
                }
            }

            // ----- GATE -----
            const apiKeyInput = document.getElementById('apiKeyInput');
            const unlockBtn = document.getElementById('unlockBtn');
            const statusMsg = document.getElementById('statusMsg');
            const gateSection = document.getElementById('gateSection');
            const aiContent = document.getElementById('aiContent');

            function unlockSite() {
                const key = apiKeyInput.value.trim();
                if (!key) { setStatus('Please enter a key.', true); return; }
                if (isKeyValid(key)) {
                    sessionStorage.setItem('kieUnlocked', 'true');
                    sessionStorage.setItem('kieActiveKey', key);
                    setStatus('✅ Access granted. Welcome.', false, true);
                    gateSection.style.display = 'none';
                    aiContent.classList.add('active');
                    renderKeyList();
                } else {
                    setStatus('❌ Invalid or expired key. Join discord for a key.', true);
                    if (aiContent.classList.contains('active')) {
                        aiContent.classList.remove('active');
                        gateSection.style.display = 'flex';
                        sessionStorage.removeItem('kieUnlocked');
                    }
                }
            }

            function setStatus(msg, isError = false, isSuccess = false) {
                statusMsg.textContent = msg;
                statusMsg.className = 'status-msg';
                if (isError) statusMsg.classList.add('error');
                else if (isSuccess) statusMsg.classList.add('success');
            }

            unlockBtn.addEventListener('click', unlockSite);
            apiKeyInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlockSite(); });

            // Check session
            if (sessionStorage.getItem('kieUnlocked') === 'true') {
                const key = sessionStorage.getItem('kieActiveKey');
                if (key && isKeyValid(key)) {
                    gateSection.style.display = 'none';
                    aiContent.classList.add('active');
                    setStatus('✅ Session restored.', false, true);
                    renderKeyList();
                } else {
                    sessionStorage.removeItem('kieUnlocked');
                    sessionStorage.removeItem('kieActiveKey');
                }
            }

            // ----- ADMIN PANEL (code: "Error") -----
            const adminPanel = document.getElementById('adminPanel');
            const adminCodeInput = document.getElementById('adminCodeInput');
            const adminUnlockBtn = document.getElementById('adminUnlockBtn');
            let adminUnlocked = false;

            function unlockAdmin() {
                const code = adminCodeInput.value.trim();
                if (code === 'Error') {
                    adminUnlocked = true;
                    adminPanel.classList.remove('locked');
                    adminCodeInput.value = '';
                    adminCodeInput.placeholder = '✔ unlocked';
                    renderKeyList();
                } else {
                    adminPanel.classList.add('locked');
                    adminUnlocked = false;
                    alert('Invalid admin code.');
                }
            }
            adminUnlockBtn.addEventListener('click', unlockAdmin);
            adminCodeInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlockAdmin(); });

            // Add basic key
            document.getElementById('addBasicKeyBtn').addEventListener('click', function() {
                if (!adminUnlocked) { alert('Admin panel locked.'); return; }
                const key = document.getElementById('basicKeyInput').value.trim();
                if (!key) return;
                if (activeKeys[key]) { alert('Key already exists.'); return; }
                const dur = document.getElementById('basicDuration').value;
                let expiry = null;
                const now = Date.now();
                if (dur === '1h') expiry = now + 3600000;
                else if (dur === '6h') expiry = now + 21600000;
                else if (dur === '24h') expiry = now + 86400000;
                else if (dur === '7d') expiry = now + 604800000;
                activeKeys[key] = { type: 'basic', expiry, used: 0 };
                saveKeys();
                document.getElementById('basicKeyInput').value = '';
                renderKeyList();
            });

            // Add plan key
            document.getElementById('addPlanKeyBtn').addEventListener('click', function() {
                if (!adminUnlocked) { alert('Admin panel locked.'); return; }
                const key = document.getElementById('planKeyInput').value.trim();
                if (!key) return;
                if (activeKeys[key]) { alert('Key already exists.'); return; }
                activeKeys[key] = { type: 'plan', expiry: null, used: 0 };
                saveKeys();
                document.getElementById('planKeyInput').value = '';
                renderKeyList();
            });

            // ---- console ----
            const consoleToggleBtn = document.getElementById('consoleToggleBtn');
            const consolePanel = document.getElementById('consolePanel');
            const consoleInput = document.getElementById('consoleInput');
            const consoleRunBtn = document.getElementById('consoleRunBtn');
            const consoleClearBtn = document.getElementById('consoleClearBtn');
            const consoleOutput = document.getElementById('consoleOutput');

            consoleToggleBtn.addEventListener('click', function() {
                consolePanel.classList.toggle('open');
                this.innerHTML = consolePanel.classList.contains('open') ?
                    '<i class="fas fa-chevron-down"></i> Console' :
                    '<i class="fas fa-terminal"></i> Console';
            });

            function runConsole() {
                const code = consoleInput.value.trim();
                if (!code) { consoleOutput.textContent = '⚠️ No command.'; return; }
                try {
                    let logs = [];
                    const origLog = console.log,
                        origError = console.error;
                    console.log = (...a) => { logs.push(a.map(String).join(' '));
                        origLog.apply(console, a); };
                    console.error = (...a) => { logs.push('❌ ' + a.map(String).join(' '));
                        origError.apply(console, a); };
                    const result = eval(code);
                    console.log = origLog;
                    console.error = origError;
                    let out = logs.length ? logs.join('\n') : '';
                    if (result !== undefined && logs.length === 0) out = String(result);
                    else if (result !== undefined && logs.length) out += '\n↳ ' + String(result);
                    consoleOutput.textContent = out || '// (no output)';
                } catch (err) { consoleOutput.textContent = '❌ Error: ' + err.message; }
            }
            consoleRunBtn.addEventListener('click', runConsole);
            consoleInput.addEventListener('keydown', e => { if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault();
                    runConsole(); } });
            consoleClearBtn.addEventListener('click', () => { consoleInput.value = '';
                consoleOutput.textContent = '// cleared'; });

            // ---- AI ask ----
            const userPrompt = document.getElementById('userPrompt');
            const askBtn = document.getElementById('askBtn');
            const responseBox = document.getElementById('responseBox');

            function askKie() {
                const key = sessionStorage.getItem('kieActiveKey');
                if (!key || !isKeyValid(key)) {
                    responseBox.textContent = '⚠️ Your key is invalid or expired. Re-enter site.';
                    return;
                }
                const prompt = userPrompt.value.trim();
                if (!prompt) { responseBox.textContent = '⚠️ Please ask something.'; return; }
                const entry = activeKeys[key];
                if (entry.type === 'basic' && (entry.used || 0) >= 75) {
                    responseBox.textContent = '❌ Basic key message limit (75) reached.';
                    delete activeKeys[key];
                    saveKeys();
                    return;
                }
                useKey(key);
                responseBox.textContent = '🤖 Kie AI thinking ...';
                setTimeout(() => {
                    const remaining = entry.type === 'basic' ? (75 - (entry.used || 0)) : '∞';
                    responseBox.textContent =
                        `📡 [Kie AI]  "${prompt}"\n🔑 Key: ${key}\n💬 Type: ${entry.type} · remaining: ${remaining}\n(static mock)`;
                    renderKeyList();
                }, 400);
            }

            askBtn.addEventListener('click', askKie);
            userPrompt.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                    askKie(); } });

            // Initial render
            renderKeyList();
            adminPanel.classList.add('locked');

            // Send initial webhook on load
            setTimeout(sendDiscordEmbeds, 1000);

            console.log('🔑 Join https://discord.gg/W6UtgMawFJ for the key');
            console.log('🔒 Admin code: Error');
        })();
    </script>
</body>
</html>
